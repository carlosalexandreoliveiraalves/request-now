<div class="members-list-container">
  @if (membersList().length === 0) {
    <div class="empty-state">Nenhum membro encontrado.</div>
  } @else {
    <div class="list-grid">
      @for (member of membersList(); track member.fk_user) {
        <app-group-members-card [member]="member"></app-group-members-card>
      }
    </div>
  }
</div>
