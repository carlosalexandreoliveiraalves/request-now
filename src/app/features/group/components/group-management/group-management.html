<div class="modal-overlay">
  <div class="modal-container">
    <div class="management-wrapper">
      <div class="header">
        <h2>Gerenciamento de Membros - '{{ group().name }}'</h2>
        <p class="subtitle">Visualize quem faz parte deste grupo.</p>
      </div>

      <app-group-members-list [groupId]="group().id!"></app-group-members-list>
    </div>

    <button class="btn-close-modal" (click)="closeManagement()">Fechar</button>
  </div>
</div>
