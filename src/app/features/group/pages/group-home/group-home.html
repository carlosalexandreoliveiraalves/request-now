<main class="groups-page">
  <header class="page-header">
    <div class="header-info">
      <h1>Meus Grupos</h1>
      <p>Gerencie seus espaços de trabalho</p>
    </div>

    <div class="header-actions">
      <div class="search-input">
        <span class="material-icons">search</span>
        <input type="text" placeholder="Buscar grupos..." />
      </div>

      <button (click)="openModal()" type="button" class="btn-create">
        <span class="material-icons">add</span>
        <span>Novo Grupo</span>
      </button>
    </div>
  </header>

  <article class="content-grid">
    <app-group-list> </app-group-list>
  </article>
</main>

@if (this.groupModalService.isModalOpen()) {
  <app-group-modal> </app-group-modal>
}
